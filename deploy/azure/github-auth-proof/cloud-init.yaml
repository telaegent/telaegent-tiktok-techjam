#cloud-config
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git
  - jq
  - openssh-server

write_files:
  - path: /usr/local/sbin/telaegent-install-gh-proof
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      admin_user='__ADMIN_USERNAME__'
      gh_version='__GH_VERSION__'
      gh_sha256='__GH_SHA256__'
      archive="/tmp/gh_${gh_version}_linux_amd64.tar.gz"
      extract_dir="/tmp/gh_${gh_version}_extract"

      getent passwd "${admin_user}" >/dev/null
      curl --fail --location --silent --show-error \
        "https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_amd64.tar.gz" \
        --output "${archive}"
      printf '%s  %s\n' "${gh_sha256}" "${archive}" | sha256sum --check --strict

      rm -rf -- "${extract_dir}"
      mkdir -p "${extract_dir}"
      tar -xzf "${archive}" --strip-components=2 -C "${extract_dir}" \
        "gh_${gh_version}_linux_amd64/bin/gh"
      install -o root -g root -m 0755 "${extract_dir}/gh" /usr/local/bin/gh
      rm -rf -- "${archive}" "${extract_dir}"

      install -d -o "${admin_user}" -g "${admin_user}" -m 0700 \
        /var/lib/telaegent/github-auth-proof
      install -d -o "${admin_user}" -g "${admin_user}" -m 0700 \
        /var/lib/telaegent/github-auth-proof/home \
        /var/lib/telaegent/github-auth-proof/gh-config \
        /var/lib/telaegent/github-auth-proof/state \
        /var/lib/telaegent/github-auth-proof/workspaces
      touch /var/lib/telaegent/github-auth-proof/READY
      chown "${admin_user}:${admin_user}" /var/lib/telaegent/github-auth-proof/READY
      chmod 0600 /var/lib/telaegent/github-auth-proof/READY

  - path: /usr/local/bin/telaegent-gh-proof
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      export HOME=/var/lib/telaegent/github-auth-proof/home
      export GH_CONFIG_DIR=/var/lib/telaegent/github-auth-proof/gh-config
      export XDG_STATE_HOME=/var/lib/telaegent/github-auth-proof/state
      umask 077
      exec /usr/local/bin/gh "$@"

  - path: /usr/local/bin/telaegent-gh-proof-verify
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail

      if [[ $# -ne 2 ]]; then
        echo 'usage: telaegent-gh-proof-verify OWNER/REPOSITORY EXPECTED_NUMERIC_ID' >&2
        exit 64
      fi
      repository="$1"
      expected_id="$2"
      if [[ ! "${repository}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
        echo 'invalid repository name' >&2
        exit 64
      fi
      if [[ ! "${expected_id}" =~ ^[0-9]+$ ]]; then
        echo 'invalid expected repository ID' >&2
        exit 64
      fi

      ghp=/usr/local/bin/telaegent-gh-proof
      "${ghp}" auth status --hostname github.com
      echo SAFE_IDENTITY
      "${ghp}" api user --jq '{id: .id, login: .login}'

      credential_file=/var/lib/telaegent/github-auth-proof/gh-config/hosts.yml
      if [[ ! -f "${credential_file}" ]]; then
        echo 'credential file is missing' >&2
        exit 1
      fi
      echo CREDENTIAL_FILE_METADATA
      stat -c '%a %U:%G %s %n' "${credential_file}"

      "${ghp}" auth setup-git
      echo REPOSITORY_DISCOVERY_COUNTS
      printf 'all_accessible='
      "${ghp}" api --paginate \
        'user/repos?per_page=100&affiliation=owner,collaborator,organization_member' \
        --jq '.[].id' | sort -u | wc -l
      printf 'owned='
      "${ghp}" api --paginate 'user/repos?per_page=100&affiliation=owner' \
        --jq '.[].id' | sort -u | wc -l
      printf 'direct_collaborator='
      "${ghp}" api --paginate 'user/repos?per_page=100&affiliation=collaborator' \
        --jq '.[].id' | sort -u | wc -l
      printf 'organization_member='
      "${ghp}" api --paginate 'user/repos?per_page=100&affiliation=organization_member' \
        --jq '.[].id' | sort -u | wc -l

      repository_json="$("${ghp}" api "repos/${repository}")"
      actual_id="$(jq -r '.id' <<<"${repository_json}")"
      if [[ "${actual_id}" != "${expected_id}" ]]; then
        echo "repository ID mismatch: expected ${expected_id}, received ${actual_id}" >&2
        exit 1
      fi
      jq '{id: .id, fullName: .full_name, private: .private, defaultBranch: .default_branch}' \
        <<<"${repository_json}"

      workspace="/var/lib/telaegent/github-auth-proof/workspaces/${expected_id}"
      if [[ -d "${workspace}/.git" ]]; then
        git -C "${workspace}" fetch --quiet --prune
      else
        if [[ -e "${workspace}" ]]; then
          echo 'workspace path exists but is not a Git checkout' >&2
          exit 1
        fi
        "${ghp}" repo clone "${repository}" "${workspace}" -- --depth=1
      fi
      echo REPOSITORY_CHECKOUT
      printf 'insideWorkTree='
      git -C "${workspace}" rev-parse --is-inside-work-tree
      printf 'commit='
      git -C "${workspace}" rev-parse HEAD

  - path: /usr/local/bin/telaegent-gh-proof-clean
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      ghp=/usr/local/bin/telaegent-gh-proof
      if "${ghp}" auth status --hostname github.com >/dev/null 2>&1; then
        login="$("${ghp}" api user --jq '.login')"
        "${ghp}" auth logout --hostname github.com --user "${login}"
      fi
      rm -rf -- \
        /var/lib/telaegent/github-auth-proof/home \
        /var/lib/telaegent/github-auth-proof/gh-config \
        /var/lib/telaegent/github-auth-proof/state \
        /var/lib/telaegent/github-auth-proof/workspaces
      install -d -m 0700 \
        /var/lib/telaegent/github-auth-proof/home \
        /var/lib/telaegent/github-auth-proof/gh-config \
        /var/lib/telaegent/github-auth-proof/state \
        /var/lib/telaegent/github-auth-proof/workspaces
      echo LOCAL_GITHUB_AUTH_AND_CHECKOUT_REMOVED

runcmd:
  - [bash, /usr/local/sbin/telaegent-install-gh-proof]

final_message: 'Telaegent GitHub authentication proof VM is ready.'

