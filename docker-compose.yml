services:
  telaegent-control-plane:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${CONTAINER_RUNTIME_BASE_IMAGE:-node:22-bookworm-slim}
    image: telaegent-control-plane:local
    restart: unless-stopped
    env_file:
      - ${LAUNCHPAD_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_DATA_DIR: /app/data
      ENABLE_LEGACY_LOCAL_PLAYGROUND: "0"
    ports:
      - "${PUBLIC_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 1g
    cpus: 2
