<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="t d">
  <title id="t">How one message crosses between two developers</title>
  <desc id="d">Work happens privately on each developer's machine. Only content a human explicitly approves crosses into the shared project conversation.</desc>
  <style>
    text { font-family: ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,sans-serif }
    .page  { fill:#FFFFFF }
    .zoneA { fill:#F5F8FC; stroke:#C3CFDF }
    .zoneC { fill:#FBF9F3; stroke:#D8D0BE }
    .tag   { fill:#FFE08A; stroke:#111111 }
    .tagt  { font-size:12px; font-weight:700; fill:#111111; letter-spacing:.06em }
    .proc  { fill:#111111 }
    .proct { font-size:13.5px; fill:#FFFFFF }
    .procs { font-size:11.5px; fill:#B9BDC4; font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
    .pill  { fill:#DCE7F5; stroke:#9DB4D4 }
    .pillt { font-size:13.5px; fill:#111111 }
    .gate  { fill:#FFFFFF; stroke:#111111; stroke-width:2 }
    .gatet { font-size:13.5px; font-weight:700; fill:#111111 }
    .gates { font-size:12px; fill:#444444; font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
    .priv  { fill:none; stroke:#D93A3A; stroke-width:1.6; stroke-dasharray:7 5 }
    .privt { font-size:11.5px; font-weight:700; fill:#D93A3A; letter-spacing:.04em }
    .wire  { fill:none; stroke:#333333; stroke-width:1.6 }
    .wireo { fill:none; stroke:#333333; stroke-width:1.6; stroke-dasharray:6 4 }
    .wl    { font-size:12.5px; fill:#111111 }
    .wm    { font-size:11.5px; fill:#666666; font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
    .num   { font-size:11.5px; font-weight:700; fill:#8A8A8A; font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
    .foot  { font-size:13px; fill:#444444 }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#333333"/></marker>
  </defs>

  <rect class="page" width="1440" height="1000"/>

  <rect class="zoneA" x="36"   y="64" width="416" height="836" rx="8"/>
  <rect class="zoneC" x="512"  y="64" width="416" height="836" rx="8"/>
  <rect class="zoneA" x="988"  y="64" width="416" height="836" rx="8"/>

  <rect class="tag" x="52"   y="48" width="188" height="26" rx="3"/>
  <text class="tagt" x="64"   y="66">A'S MACHINE</text>
  <rect class="tag" x="528"  y="48" width="188" height="26" rx="3"/>
  <text class="tagt" x="540"  y="66">TELAEGENT CLOUD</text>
  <rect class="tag" x="1004" y="48" width="188" height="26" rx="3"/>
  <text class="tagt" x="1016" y="66">B'S MACHINE</text>

  <!-- A private -->
  <rect class="priv" x="60" y="104" width="368" height="184" rx="6"/>
  <text class="privt" x="72" y="126">PRIVATE — NEVER LEAVES THIS MACHINE</text>
  <rect class="pill" x="76" y="140" width="336" height="44" rx="22"/>
  <text class="num"   x="92"  y="167">01</text>
  <text class="pillt" x="124" y="167">Rough request from A</text>
  <path class="wire" d="M244 184 V200" marker-end="url(#ar)"/>
  <rect class="proc" x="76" y="206" width="336" height="60" rx="4"/>
  <text class="num"   x="92"  y="231">02</text>
  <text class="proct" x="124" y="231">Agent clarifies and inspects</text>
  <text class="procs" x="124" y="252">reads A's local repository · flags risk</text>

  <path class="wire" d="M244 288 V306" marker-end="url(#ar)"/>
  <rect class="gate" x="76" y="312" width="336" height="58" rx="4"/>
  <text class="num"   x="92"  y="337">03</text>
  <text class="gatet" x="124" y="337">A approves the exact text</text>
  <text class="gates" x="124" y="358">Edit   ·   No   ·   Send</text>

  <!-- 04 A -> cloud -->
  <path class="wire" d="M412 341 H470 V420 H548" marker-end="url(#ar)"/>
  <text class="wl" x="556" y="382">04  approved request only</text>
  <rect class="pill" x="556" y="398" width="328" height="44" rx="22"/>
  <text class="pillt" x="578" y="425">Shared conversation · request</text>

  <!-- 05 cloud -> B -->
  <path class="wire" d="M884 420 H950 V536 H1024" marker-end="url(#ar)"/>
  <text class="wl" x="556" y="470">05  relayed to B's connector</text>
  <text class="wm" x="556" y="490">opaque binding · no path, no command</text>

  <!-- B private -->
  <rect class="priv" x="1012" y="472" width="368" height="140" rx="6"/>
  <text class="privt" x="1024" y="494">PRIVATE — NEVER LEAVES THIS MACHINE</text>
  <rect class="proc" x="1032" y="506" width="336" height="60" rx="4"/>
  <text class="num"   x="1048" y="531">06</text>
  <text class="proct" x="1080" y="531">Agent investigates B's repo</text>
  <text class="procs" x="1080" y="552">hard policy blocks raw secret values</text>

  <!-- 07 capability ask, B -> A -->
  <path class="wireo" d="M1196 612 V624 H244 V654" marker-end="url(#ar)"/>
  <text class="wl" x="560" y="616">07  optional: asks for one file it cannot see</text>

  <rect class="gate" x="76" y="660" width="336" height="58" rx="4"/>
  <text class="num"   x="92"  y="685">08</text>
  <text class="gatet" x="124" y="685">A scopes that one resource</text>
  <text class="gates" x="124" y="706">Deny · Allow once · Allow for task</text>

  <!-- 10 A -> B -->
  <path class="wireo" d="M412 689 H452 V752 H1196 V758" marker-end="url(#ar)"/>
  <text class="wl" x="560" y="744">09  only the approved resource</text>

  <rect class="gate" x="1032" y="764" width="336" height="58" rx="4"/>
  <text class="num"   x="1048" y="789">10</text>
  <text class="gatet" x="1080" y="789">B approves the response</text>
  <text class="gates" x="1080" y="810">Edit   ·   No   ·   Send</text>

  <!-- 11 B -> cloud -->
  <path class="wire" d="M1196 822 V842 H720 V844" marker-end="url(#ar)"/>
  <text class="wl" x="800" y="834">11  approved answer only</text>
  <rect class="pill" x="556" y="850" width="328" height="44" rx="22"/>
  <text class="pillt" x="578" y="877">Shared conversation · answer</text>

  <!-- 12 cloud -> A -->
  <path class="wire" d="M556 872 H456" marker-end="url(#ar)"/>
  <text class="wl" x="76" y="877">12  A reads the answer</text>

  <line x1="36" y1="928" x2="1404" y2="928" stroke="#DDDDDD"/>
  <text class="foot" x="36" y="956">Crosses only after a human presses Send:  the approved request  ·  one scoped resource  ·  the approved answer</text>
  <text class="foot" x="36" y="980">Never crosses:  unsent input  ·  private drafting turns  ·  repository contents  ·  provider credentials  ·  local paths</text>
</svg>
