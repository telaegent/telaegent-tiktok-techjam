<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="630" viewBox="0 0 1440 630" role="img" aria-labelledby="title desc">
  <title id="title">Telaegent's human-gated project conversation</title>
  <desc id="desc">Two isolated agent workspaces exchange a project message only after the sender and recipient each approve the exact content.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07152F"/>
      <stop offset="1" stop-color="#10234B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#16C8F3"/>
      <stop offset="1" stop-color="#6F57FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#010817" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#44D8FF"/>
    </marker>
  </defs>
  <rect width="1440" height="630" rx="28" fill="url(#background)"/>
  <g opacity=".22" fill="none" stroke="#5EBAF6">
    <circle cx="104" cy="97" r="150"/>
    <circle cx="1348" cy="547" r="210"/>
    <path d="M0 480 C280 420 290 680 620 596 S1050 432 1440 540"/>
  </g>
  <text x="720" y="74" text-anchor="middle" fill="#EAF7FF" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">One project conversation. Two private agent workspaces. Humans decide what crosses.</text>

  <g filter="url(#shadow)">
    <rect x="84" y="166" width="336" height="330" rx="24" fill="#102747" stroke="#2F608B" stroke-width="2"/>
    <rect x="102" y="185" width="300" height="43" rx="12" fill="#16365E"/>
    <circle cx="129" cy="206" r="10" fill="#21D4F7"/>
    <text x="151" y="214" fill="#EAF7FF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">A's private workspace</text>
    <rect x="117" y="253" width="270" height="93" rx="16" fill="#0B1B36" stroke="#28577F"/>
    <text x="140" y="286" fill="#B9D9ED" font-family="Arial, Helvetica, sans-serif" font-size="15">Rough request</text>
    <text x="140" y="316" fill="#F4FBFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">“Can you explain the auth flow?”</text>
    <rect x="117" y="365" width="270" height="105" rx="16" fill="#132F52" stroke="#3E7096"/>
    <text x="140" y="397" fill="#B9D9ED" font-family="Arial, Helvetica, sans-serif" font-size="15">Agent prepares a safe draft</text>
    <text x="140" y="426" fill="#F4FBFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Clarify • inspect • propose</text>
    <circle cx="351" cy="418" r="17" fill="url(#accent)"/>
    <path d="M344 418 l5 5 10-12" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="542" y="145" width="356" height="372" rx="28" fill="#F5FAFF"/>
    <rect x="570" y="175" width="300" height="54" rx="14" fill="url(#accent)"/>
    <path d="M601 195 a13 13 0 1 1 0 26 a13 13 0 1 1 0-26 M623 208 h19 M638 208 l9-9 M638 208 l9 9" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="662" y="211" fill="#FFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Human approval gate</text>
    <text x="720" y="276" text-anchor="middle" fill="#173254" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">The exact draft stays private until its owner decides.</text>
    <rect x="585" y="316" width="92" height="50" rx="12" fill="#E5EDF5"/>
    <text x="631" y="347" text-anchor="middle" fill="#24415F" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Edit</text>
    <rect x="690" y="316" width="74" height="50" rx="12" fill="#FDEBEC"/>
    <text x="727" y="347" text-anchor="middle" fill="#A02E3A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">No</text>
    <rect x="777" y="316" width="92" height="50" rx="12" fill="#143F69"/>
    <text x="823" y="347" text-anchor="middle" fill="#FFF" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Send</text>
    <path d="M610 424 H830" stroke="#D5E2ED" stroke-width="2"/>
    <text x="720" y="461" text-anchor="middle" fill="#526E89" font-family="Arial, Helvetica, sans-serif" font-size="15">Hard policy blocks raw secrets and out-of-project access.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1020" y="166" width="336" height="330" rx="24" fill="#102747" stroke="#2F608B" stroke-width="2"/>
    <rect x="1038" y="185" width="300" height="43" rx="12" fill="#16365E"/>
    <circle cx="1065" cy="206" r="10" fill="#8B72FF"/>
    <text x="1087" y="214" fill="#EAF7FF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">B's private workspace</text>
    <rect x="1053" y="253" width="270" height="93" rx="16" fill="#0B1B36" stroke="#28577F"/>
    <text x="1076" y="286" fill="#B9D9ED" font-family="Arial, Helvetica, sans-serif" font-size="15">Approved project request</text>
    <text x="1076" y="316" fill="#F4FBFF" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">“Can you explain the auth flow?”</text>
    <rect x="1053" y="365" width="270" height="105" rx="16" fill="#132F52" stroke="#3E7096"/>
    <text x="1076" y="397" fill="#B9D9ED" font-family="Arial, Helvetica, sans-serif" font-size="15">Agent investigates B's repository</text>
    <text x="1076" y="426" fill="#F4FBFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Draft response • approve • share</text>
    <circle cx="1287" cy="418" r="17" fill="url(#accent)"/>
    <path d="M1280 418 l5 5 10-12" fill="none" stroke="#FFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M420 331 H527" fill="none" stroke="#44D8FF" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M902 331 H1005" fill="none" stroke="#44D8FF" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="473" y="309" text-anchor="middle" fill="#BFEAFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">approved only</text>
  <text x="953" y="309" text-anchor="middle" fill="#BFEAFF" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">approved only</text>
</svg>
