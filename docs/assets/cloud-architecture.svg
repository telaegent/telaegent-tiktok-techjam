<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="t d">
  <title id="t">Cloud coordination around locally running agents</title>
  <desc id="d">The browser talks to a control plane that keeps identity and the shared conversation in Supabase. Each developer's connector dials outbound to the job relay. Repositories, GitHub CLI identity, provider CLIs and credentials never leave the developer's machine.</desc>
  <style>
    text { font-family: ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,sans-serif }
    .page  { fill:#FFFFFF }
    .band  { fill:#FBF9F3 }
    .bandl { fill:#F5F8FC }
    .zone  { fill:none; stroke:#CFC9B8 }
    .zonel { fill:none; stroke:#C3CFDF }
    .tag   { fill:#FFE08A; stroke:#111111 }
    .tagt  { font-size:12px; font-weight:700; fill:#111111; letter-spacing:.06em }
    .node  { fill:#FFFFFF; stroke:#111111; stroke-width:1.6 }
    .proc  { fill:#111111 }
    .proct { font-size:14px; fill:#FFFFFF }
    .procs { font-size:11.5px; fill:#B9BDC4; font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
    .n     { font-size:14px; font-weight:700; fill:#111111 }
    .s     { font-size:12px; fill:#555555 }
    .m     { font-size:11.5px; fill:#777777; font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
    .wire  { fill:none; stroke:#333333; stroke-width:1.6 }
    .out   { fill:none; stroke:#D93A3A; stroke-width:2 }
    .outt  { font-size:12.5px; font-weight:700; fill:#D93A3A }
    .wl    { font-size:12px; fill:#444444 }
    .foot  { font-size:13px; fill:#444444 }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#333333"/></marker>
    <marker id="rd" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#D93A3A"/></marker>
  </defs>

  <rect class="page" width="1440" height="660"/>

  <!-- cloud band -->
  <rect class="band" x="36" y="52" width="1368" height="222" rx="6"/>
  <rect class="zone" x="36" y="52" width="1368" height="222" rx="6"/>
  <rect class="tag"  x="52" y="38" width="176" height="26" rx="3"/>
  <text class="tagt" x="64" y="56">TELAEGENT CLOUD</text>

  <rect class="node" x="580" y="82" width="280" height="52" rx="4"/>
  <text class="n" x="600" y="106">Browser product</text>
  <text class="s" x="600" y="124">React 19 + Vite</text>

  <path class="wire" d="M720 134 V158" marker-end="url(#ar)"/>

  <rect class="proc" x="580" y="164" width="280" height="60" rx="4"/>
  <text class="proct" x="600" y="190">Control plane</text>
  <text class="procs" x="600" y="210">Caddy + Fastify 5 · AWS EC2</text>

  <rect class="node" x="140" y="164" width="280" height="76" rx="4"/>
  <text class="n" x="160" y="190">Supabase</text>
  <text class="s" x="160" y="210">identity · project data</text>
  <text class="s" x="160" y="228">shared conversation · approvals</text>
  <path class="wire" d="M580 194 H428" marker-end="url(#ar)"/>

  <rect class="node" x="1020" y="164" width="280" height="76" rx="4"/>
  <text class="n" x="1040" y="190">Connector job relay</text>
  <text class="s" x="1040" y="210">bounded jobs · presence</text>
  <text class="m" x="1040" y="228">no path · no command · no credential</text>
  <path class="wire" d="M860 194 H1012" marker-end="url(#ar)"/>

  <!-- outbound -->
  <path class="out" d="M300 400 V330 H1160 V248" marker-end="url(#rd)"/>
  <path class="out" d="M1140 400 V330" marker-end="url(#rd)"/>
  <text class="outt" x="470" y="322">each connector opens this connection outbound</text>
  <text class="wl"   x="470" y="352">long-poll · no inbound port on any developer machine</text>

  <!-- machine A -->
  <rect class="bandl" x="36" y="400" width="640" height="180" rx="6"/>
  <rect class="zonel" x="36" y="400" width="640" height="180" rx="6"/>
  <rect class="tag"  x="52" y="386" width="212" height="26" rx="3"/>
  <text class="tagt" x="64" y="404">DEVELOPER A · MACHINE</text>

  <rect class="proc" x="60" y="424" width="592" height="52" rx="4"/>
  <text class="proct" x="80" y="448">Connector — binding: user A × repository X</text>
  <text class="procs" x="80" y="466">outbound only</text>
  <rect class="node" x="60" y="490" width="288" height="66" rx="4"/>
  <text class="s" x="80" y="516">Repository checkout</text>
  <text class="m" x="80" y="538">GitHub CLI identity</text>
  <rect class="node" x="364" y="490" width="288" height="66" rx="4"/>
  <text class="s" x="384" y="516">Codex / Claude Code</text>
  <text class="m" x="384" y="538">existing local login</text>

  <!-- machine B -->
  <rect class="bandl" x="764" y="400" width="640" height="180" rx="6"/>
  <rect class="zonel" x="764" y="400" width="640" height="180" rx="6"/>
  <rect class="tag"  x="780" y="386" width="212" height="26" rx="3"/>
  <text class="tagt" x="792" y="404">DEVELOPER B · MACHINE</text>

  <rect class="proc" x="788" y="424" width="592" height="52" rx="4"/>
  <text class="proct" x="808" y="448">Connector — binding: user B × repository X</text>
  <text class="procs" x="808" y="466">outbound only</text>
  <rect class="node" x="788" y="490" width="288" height="66" rx="4"/>
  <text class="s" x="808" y="516">Repository checkout</text>
  <text class="m" x="808" y="538">GitHub CLI identity</text>
  <rect class="node" x="1092" y="490" width="288" height="66" rx="4"/>
  <text class="s" x="1112" y="516">Codex / Claude Code</text>
  <text class="m" x="1112" y="538">existing local login</text>

  <line x1="36" y1="606" x2="1404" y2="606" stroke="#DDDDDD"/>
  <text class="foot" x="36" y="634">Isolation unit is user × repository. The cloud holds no repository content, no provider credential and no local path — it selects an opaque binding and the connector resolves it.</text>
</svg>
