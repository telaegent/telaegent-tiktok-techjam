  </g>
  <g filter="url(#shadow)">
    <rect x="120" y="316" width="300" height="104" rx="18" fill="#E9F8FF" stroke="#18C8F4" stroke-width="2"/>
    <text x="270" y="350" text-anchor="middle" fill="#102747" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Supabase</text><text x="270" y="378" text-anchor="middle" fill="#294B68" font-family="Arial, Helvetica, sans-serif" font-size="16">Identity · project data ·</text><text x="270" y="400" text-anchor="middle" fill="#294B68" font-family="Arial, Helvetica, sans-serif" font-size="16">shared conversation</text>
