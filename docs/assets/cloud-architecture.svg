<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Telaegent cloud-first architecture</title>
  <desc id="desc">The browser connects to the control plane, which stores shared state in Supabase and manages two isolated user by repository runtimes with separate GitHub, repository, and provider state.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152F"/><stop offset="1" stop-color="#10234B"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16C8F3"/><stop offset="1" stop-color="#6F57FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="13" stdDeviation="17" flood-color="#010817" flood-opacity=".35"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M0 0 L11 5.5 L0 11 Z" fill="#44D8FF"/></marker>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#background)"/>
  <g opacity=".18" fill="none" stroke="#5EBAF6"><circle cx="90" cy="104" r="172"/><circle cx="1360" cy="676" r="214"/><path d="M0 624 C252 535 387 757 675 653 S1142 548 1440 655"/></g>
  <text x="720" y="66" text-anchor="middle" fill="#EAF7FF" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Cloud-first collaboration, isolated at user × repository.</text>

  <g fill="none" stroke="#44D8FF" stroke-width="4" marker-end="url(#arrow)">
