    <text x="720" y="116" text-anchor="middle" fill="#102747" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Browser product</text><text x="720" y="143" text-anchor="middle" fill="#294B68" font-family="Arial, Helvetica, sans-serif" font-size="17">React / Vite</text>
