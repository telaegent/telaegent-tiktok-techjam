<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="t d">
  <title id="t">Four sequential trust boundaries</title>
  <desc id="d">Telaegent identity, GitHub repository authorization, the project collaborator connection, and human approval of exact content are four separate boundaries. Passing one never grants the next.</desc>
  <style>
    text { font-family: ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,sans-serif }
    .page { fill:#FFFFFF }
    .card { fill:#FFFFFF; stroke:#111111; stroke-width:1.6 }
    .cap  { fill:#111111 }
    .capn { font-size:12px; font-weight:700; fill:#FFFFFF; font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
    .name { font-size:15px; font-weight:700; fill:#111111 }
    .q    { font-size:12.5px; fill:#444444 }
    .hr   { stroke:#DDDDDD }
    .noh  { font-size:10.5px; font-weight:700; fill:#D93A3A; letter-spacing:.08em }
    .no   { font-size:12px; fill:#555555 }
    .out  { fill:#DCE7F5; stroke:#9DB4D4 }
    .outn { font-size:14px; font-weight:700; fill:#111111 }
    .outs { font-size:12px; fill:#444444 }
    .wire { fill:none; stroke:#333333; stroke-width:1.6 }
    .foot { font-size:13px; fill:#444444 }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#333333"/></marker>
  </defs>

  <rect class="page" width="1440" height="440"/>

  <!-- 1 -->
  <rect class="card" x="36" y="36" width="300" height="252" rx="4"/>
  <rect class="cap"  x="36" y="36" width="300" height="30"/>
  <text class="capn" x="52" y="56">BOUNDARY 01</text>
  <text class="name" x="52" y="94">Telaegent identity</text>
  <text class="q"    x="52" y="118">Who is this person?</text>
  <line class="hr" x1="52" y1="140" x2="320" y2="140"/>
  <text class="noh"  x="52" y="164">DOES NOT GRANT</text>
  <text class="no"   x="52" y="190">access to any repository</text>
  <text class="no"   x="52" y="214">the right to contact anyone</text>
  <text class="no"   x="52" y="238">a running agent</text>

  <path class="wire" d="M336 162 H370" marker-end="url(#ar)"/>

  <!-- 2 -->
  <rect class="card" x="378" y="36" width="300" height="252" rx="4"/>
  <rect class="cap"  x="378" y="36" width="300" height="30"/>
  <text class="capn" x="394" y="56">BOUNDARY 02</text>
  <text class="name" x="394" y="94">Repository authorization</text>
  <text class="q"    x="394" y="118">Which repository is this about?</text>
  <line class="hr" x1="394" y1="140" x2="662" y2="140"/>
  <text class="noh"  x="394" y="164">DOES NOT GRANT</text>
  <text class="no"   x="394" y="190">a second repository</text>
  <text class="no"   x="394" y="214">another person's checkout</text>
  <text class="no"   x="394" y="238">read access for collaborators</text>

  <path class="wire" d="M678 162 H712" marker-end="url(#ar)"/>

  <!-- 3 -->
  <rect class="card" x="720" y="36" width="300" height="252" rx="4"/>
  <rect class="cap"  x="720" y="36" width="300" height="30"/>
  <text class="capn" x="736" y="56">BOUNDARY 03</text>
  <text class="name" x="736" y="94">Collaborator connection</text>
  <text class="q"    x="736" y="118">Who may talk to me here?</text>
  <line class="hr" x1="736" y1="140" x2="1004" y2="140"/>
  <text class="noh"  x="736" y="164">DOES NOT GRANT</text>
  <text class="no"   x="736" y="190">filesystem or shell access</text>
  <text class="no"   x="736" y="214">automatic replies</text>
  <text class="no"   x="736" y="238">the same person on another repo</text>

  <path class="wire" d="M1020 162 H1054" marker-end="url(#ar)"/>

  <!-- 4 -->
  <rect class="card" x="1062" y="36" width="300" height="252" rx="4"/>
  <rect class="cap"  x="1062" y="36" width="300" height="30"/>
  <text class="capn" x="1078" y="56">BOUNDARY 04</text>
  <text class="name" x="1078" y="94">Approval of exact content</text>
  <text class="q"    x="1078" y="118">Do I want to send this text?</text>
  <line class="hr" x1="1078" y1="140" x2="1346" y2="140"/>
  <text class="noh"  x="1078" y="164">DOES NOT GRANT</text>
  <text class="no"   x="1078" y="190">the next message</text>
  <text class="no"   x="1078" y="214">a wider scope than approved</text>
  <text class="no"   x="1078" y="238">anything hard policy forbids</text>

  <!-- outcome -->
  <path class="wire" d="M1212 288 V318" marker-end="url(#ar)"/>
  <rect class="out" x="1062" y="324" width="300" height="52" rx="4"/>
  <text class="outn" x="1078" y="346">Durable shared conversation</text>
  <text class="outs" x="1078" y="366">the result of the four gates, not a fifth permission</text>

  <text class="foot" x="36" y="346">Passing one boundary never grants the next.</text>
  <text class="foot" x="36" y="372">Each is revocable on its own, and revoking one never silently leaves another open.</text>
  <text class="foot" x="36" y="410">A stable GitHub repository ID defines the project scope. Approval always names the exact content about to leave its owner's machine.</text>
</svg>
